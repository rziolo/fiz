{% extends "base.html" %}
{% block content %}
<style>
    .form-control-custom { background-color: #ffe6e6; }
    .has-value { background-color: #e6ffec !important; }
    label { font-size: 0.9rem; margin-bottom: 2px; color: #555; }
</style>

<div class="container mt-3">
    <form method="POST">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center bg-white">
                <h4 id="pageTitle" class="mb-0">{% if mode == 'edit' %}Edycja{% elif mode == 'view' %}Podgląd{% else %}Nowy wpis{% endif %}</h4>
                <div class="d-flex gap-2">
                    <a href="{{ url_for('pressure.list_pressure') }}" class="btn btn-outline-secondary btn-sm">← Powrót</a>
                    <button type="submit" id="mainSaveBtn" class="btn btn-primary btn-sm {% if mode == 'view' %}d-none{% endif %}">Zapisz</button>
                </div>
            </div>
            <div class="card-body">
                <div class="row g-2">
                    <!-- Wiersz 1: 4 kolumny -->
                    <div class="col-md-3">
                        <label>Waga (kg)</label>
                        <input type="text" name="waga" class="form-control form-control-custom" value="{{ row.waga if row }}" {{ 'readonly' if mode == 'view' }}>
                    </div>
                    <div class="col-md-3">
                        <label>Skurczowe</label>
                        <input type="number" name="P_skurczowe" class="form-control form-control-custom fw-bold" value="{{ row.P_skurczowe if row }}" {{ 'readonly' if mode == 'view' }}>
                    </div>
                    <div class="col-md-3">
                        <label>Rozkurczowe</label>
                        <input type="number" name="P_rozkurczowe" class="form-control form-control-custom fw-bold" value="{{ row.P_rozkurczowe if row }}" {{ 'readonly' if mode == 'view' }}>
                    </div>
                    <div class="col-md-3">
                        <label>Puls</label>
                        <input type="number" name="Puls" class="form-control form-control-custom" value="{{ row.Puls if row }}" {{ 'readonly' if mode == 'view' }}>
                    </div>

                    <!-- Wiersz 2: 4 kolumny -->
                    <div class="col-md-3">
                        <label>Data</label>
                        <input type="datetime-local" name="Date" class="form-control form-control-custom" value="{{ row.Date.strftime('%Y-%m-%dT%H:%M') if row else now }}" {{ 'readonly' if mode == 'view' }}>
                    </div>
                    <div class="col-md-3">
                        <label>Miasto</label>
                        <input type="text" name="miasto" class="form-control form-control-custom" value="{{ row.miasto if row else ha_data.locality }}" {{ 'readonly' if mode == 'view' }}>
                    </div>
                    <div class="col-md-3">
                        <label>Temperatura (°C)</label>
                        <input type="number" step="0.1" name="temperatura" class="form-control form-control-custom" value="{{ row.temperatura if row else ha_data.temp }}" {{ 'readonly' if mode == 'view' }}>
                    </div>
                    <div class="col-md-3">
                        <label>Ciśnienie ATM</label>
                        <input type="number" name="atmosf" class="form-control form-control-custom" value="{{ row['atmosf.'] if row else ha_data.pressure }}" {{ 'readonly' if mode == 'view' }}>
                    </div>

                    <!-- Wiersz 3: Wilgotność + Uwagi na pozostałą szerokość -->
                    <div class="col-md-3">
                        <label>Wilgotność (%)</label>
                        <input type="number" name="wilgotnosc" class="form-control form-control-custom" value="{{ row.wilgotnosc if row else ha_data.humidity }}" {{ 'readonly' if mode == 'view' }}>
                    </div>
                    <div class="col-md-9">
                        <label>Uwagi</label>
                        <input type="text" name="uwagi" class="form-control form-control-custom" value="{{ row.uwagi if row }}" {{ 'readonly' if mode == 'view' }}>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    if (window.location.pathname.includes('/edit/')) {
        document.getElementById('mainSaveBtn').classList.remove('d-none');
        document.getElementById('pageTitle').innerText = 'Edycja';
    }
    
    function checkValue(el) {
        if(el.value && el.value.trim() !== "") {
            el.classList.add('has-value');
        } else {
            el.classList.remove('has-value');
        }
    }

    document.querySelectorAll('.form-control-custom').forEach(i => {
        checkValue(i);
        i.addEventListener('input', () => checkValue(i));
    });
});
</script>
{% endblock %}
