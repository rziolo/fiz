{% extends "base.html" %}
{% block content %}
<div style="text-align: center; padding: 20px;">
    <h2>Panel Zdrowie (Home Assistant)</h2>
    {% if db_ok %}
        <div style="color: #2ecc71; font-weight: bold; border: 1px solid #2ecc71; padding: 10px; border-radius: 5px; display: inline-block;">
            ● Połączenie z bazą danych OK
        </div>
    {% else %}
        <div style="color: #e74c3c; font-weight: bold; border: 1px solid #e74c3c; padding: 10px; border-radius: 5px; display: inline-block;">
            ○ BŁĄD: {{ db_msg }}
        </div>
    {% endif %}
    <p><a href="http://192.168.1.156/aplikacje">Powrót do menu</a></p>
</div>
{% endblock %}
