{% extends "base.html" %}
{% set tytul_aplikacji = "Zdrowie" %}
{% block content %}
<div class="d-flex align-items-center mb-5">
    <h1 class="h2 mb-0 me-3">Panel Zdrowie</h1>
    {% if db_ok %}
        <span class="db-status db-ok"><i class="fas fa-check-circle me-1"></i> Połączono</span>
    {% else %}
        <span class="db-status db-err"><i class="fas fa-exclamation-triangle me-1"></i> Błąd: {{ db_msg }}</span>
    {% endif %}
</div>

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card text-center shadow-sm p-4">
            <div class="card-body">
                <i class="fas fa-heartbeat fa-5x text-danger mb-4"></i>
                <h2 class="mb-3">Ciśnienie</h2>
                <p class="text-muted mb-4">Rejestracja pomiarów i historia</p>
                <a href="{{ url_for('pressure.list_pressure') }}" class="btn btn-outline-danger btn-lg w-100">Otwórz panel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
