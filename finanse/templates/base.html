<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}System Domowy{% endblock %}</title>
    
    <!-- Ikona Favicon (Dom) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 576 512'><path fill='%23000' d='M575.8 255.5c0 18-15 32.1-32 32.1h-32l.7 160.2c0 35.3-28.7 64.1-64 64.1H128.5c-35.3 0-64-28.7-64-64.1l.7-160.2h-32c-17 0-32-14.1-32-32.1c0-9 3.5-17.6 10-24L259.5 15.7c16.1-16 42.1-16 58.2 0L565.8 231.5c6.5 6.4 10 15 10 24z'/></svg>">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (używane w menu i Zdrowiu) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap Icons (używane w Finansach) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        html, body { height: 100%; margin: 0; }
        body { background-color: #f8f9fa; display: flex; flex-direction: column; }
        .content-wrapper { flex: 1 0 auto; }
        .navbar { background-color: #000 !important; padding: 0.5rem 1rem; }
        .footer { flex-shrink: 0; background: white; border-top: 1px solid #dee2e6; padding: 15px 0; width: 100%; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <nav class="navbar navbar-expand navbar-dark mb-4">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center" href="/aplikacje">
                    <i class="fas fa-home me-2"></i> {{ tytul_aplikacji if tytul_aplikacji else 'System' }}
                </a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link px-2 text-white" href="/finanse">Finanse</a>
                    <a class="nav-link px-2 text-white" href="/inwestycje">Inwestycje</a>
                    <a class="nav-link px-2 text-white" href="/zdrowie">Zdrowie</a>
                    <a class="nav-link px-2 text-secondary" href="/aplikacje">Menu</a>
                </div>
            </div>
        </nav>
        <div class="container">{% block content %}{% endblock %}</div>
    </div>
    <footer class="footer text-center">
        <div class="container">
            <span class="text-muted">Projekt i wykonanie Robert Zioło + <span style="color: #4285f4; font-weight: bold;"><i class="fas fa-microchip"></i> Gemini AI</span></span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
