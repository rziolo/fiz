{% extends "base.html" %}
{% set tytul_aplikacji = "HUB Aplikacji" %}
{% block content %}
<style>
    /* Nadpisanie domyślnych paddingów Bootstrapa dla zwartości */
    .compact-hub .card {
        border-radius: 10px;
    }
    .compact-hub .card-body {
        padding: 0.75rem !important;
    }
    .compact-hub i.app-icon {
        font-size: 2.2rem;
    }
    .compact-hub h2.app-title {
        font-size: 1.1rem;
        font-weight: 600;
        margin-top: 0.25rem;
        margin-bottom: 0.5rem;
    }
    .compact-hub .btn-sm-custom {
        padding: 0.25rem 0.5rem;
        font-size: 0.85rem;
    }
</style>

<div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-4 row-cols-xl-4 g-2 g-md-3 text-center mt-1 compact-hub">

    <!-- Finanse-->
    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column justify-content-between">
                <div>
                    <i class="fas fa-wallet app-icon text-primary"></i>
                    <h2 class="app-title">Finanse</h2>
                </div>
                    <div class="d-flex flex-column gap-1">
                      <a href="/finanse" class="btn btn-sm-custom btn-outline-primary w-100">Finanse</a>
                    </div>
                </div>
        </div>
    </div>

    <!-- Inwestycje -->
    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column justify-content-between">
                <div>
                    <i class="fas fa-chart-line app-icon text-success"></i>
                    <h2 class="app-title">Inwestycje</h2>
                </div>
                   <div class="d-flex flex-column gap-1">
                      <a href="/inwestycje" class="btn btn-sm-custom btn-outline-success w-100">Inwestycje</a> 
                   </div>           
            </div>
        </div>
    </div>

    


    <!--Zdrowie-->
    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column justify-content-between">
                <div>
                    <i class="fas fa-heartbeat app-icon text-danger"></i>
                    <h2 class="app-title">Zdrowie</h2>
                </div>
                <a href="/zdrowie" class="btn btn-sm-custom btn-outline-danger w-100">Zdrowie</a>
            </div>
        </div>
    </div>

</div>
{% endblock %}
